save_current:
  name: Save current TOU
  description: Save a named preset from the current ESPHome readings without changing the inverter.
  fields:
    name:
      name: Preset name
      required: true
      selector:
        text:
    overwrite:
      name: Overwrite existing preset
      selector:
        boolean:
save_definition:
  name: Save preset definition
  description: Save, edit, or rename a preset in Home Assistant without changing the inverter. Pass preset_id to rename an existing preset.
  fields:
    name:
      name: Preset name
      required: true
      selector:
        text:
    preset:
      name: Preset data
      description: Work mode, solar sell and exactly six TOU slots.
      required: true
      selector:
        object:
    preset_id:
      name: Existing preset ID
      description: Stable ID from the manager sensor's preset_ids attribute; keeps weekday assignments when changing the name.
      selector:
        text:
    overwrite:
      name: Overwrite existing preset
      selector:
        boolean:
delete:
  name: Delete preset
  description: Delete a preset and clear its day assignments without changing the inverter.
  fields:
    name:
      name: Preset name
      required: true
      selector:
        text:
assign_day:
  name: Assign day
  description: Assign a preset to a weekday, or clear the assignment with an empty name.
  fields:
    day:
      name: Day
      required: true
      selector:
        select:
          options:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
    name:
      name: Preset name
      required: true
      selector:
        text:
apply:
  name: Apply preset to Deye
  description: Write the selected preset to the inverter. TOU may remain off if verification fails.
  fields:
    name:
      name: Preset name
      required: true
      selector:
        text:
set_auto:
  name: Enable weekly schedule
  description: Enable or disable automatic application on HA startup and at 00:00:15.
  fields:
    enabled:
      name: Enabled
      required: true
      selector:
        boolean:
set_selling_settings:
  name: Set selling planning settings
  description: Save selling settings. Dry run is on by default and prevents all inverter changes; turn it off only to permit approved active selling periods to change Work Mode and the active TOU SOC.
  fields:
    mode:
      name: Planning mode
      selector:
        select:
          options:
            - off
            - semi
            - automatic
    dry_run:
      name: Dry run
      description: Keep enabled to simulate plans without changing the inverter. Turning it off enables physical control during approved selling periods.
      selector:
        boolean:
    threshold:
      name: Minimum hourly price (PLN/kWh)
      selector:
        number:
          min: 0
          max: 1000
          step: 0.01
    max_ranges:
      name: Maximum ranges
      selector:
        number:
          min: 1
          max: 6
          step: 1
    time_of_day:
      name: Time of day
      selector:
        select:
          options:
            - morning
            - afternoon
            - evening
            - any
    min_soc:
      name: Minimum battery SOC
      selector:
        number:
          min: 0
          max: 100
    power_override:
      name: TOU discharge power override (W)
      selector:
        number:
          min: 1
          max: 12000
    today_price_entity:
      name: RCE PSE Price entity override
      selector:
        entity:
          domain: sensor
    tomorrow_price_entity:
      name: RCE PSE Price Tomorrow entity override
      selector:
        entity:
          domain: sensor
    battery_soc_entity:
      name: Battery BMS SOC entity
      description: Normally configured through the integration options.
      selector:
        entity:
          domain: sensor
refresh_selling_plan:
  name: Refresh selling plan
  description: Calculate a price-based plan for today or tomorrow. Does not change the inverter.
  fields:
    day:
      name: Day
      selector:
        select:
          options:
            - today
            - tomorrow
clear_selling_plans:
  name: Clear selling findings
  description: Remove all calculated and manually added selling hours. Does not change inverter settings.
add_selling_range:
  name: Add manual selling hour
  description: Add a one-hour manual selling period for today or tomorrow. Does not change inverter settings.
  fields:
    date:
      name: Date (YYYY-MM-DD)
      required: true
      selector:
        text:
    start:
      name: Start time (HH:00, HH:15, HH:30, or HH:45)
      required: true
      selector:
        text:
    target_soc:
      name: Target battery SOC
      description: Stop selling and restore the inverter plan when this SOC is reached.
      selector:
        number:
          min: 0
          max: 100
approve_selling_range:
  name: Approve selling hour
  description: Approve or unapprove one semi-automatic one-hour selling block. Does not change the inverter.
  fields:
    date:
      name: Plan date (YYYY-MM-DD)
      required: true
      selector:
        text:
    start:
      name: Start time (HH:MM)
      required: true
      selector:
        text:
    approved:
      name: Approved
      required: true
      selector:
        boolean:
set_selling_range_soc:
  name: Set selling-period target SOC
  description: Set the SOC at which this individual selling period stops. The active period must be stopped first.
  fields:
    date:
      name: Plan date (YYYY-MM-DD)
      required: true
      selector:
        text:
    start:
      name: Start time (HH:MM)
      required: true
      selector:
        text:
    target_soc:
      name: Target battery SOC
      required: true
      selector:
        number:
          min: 0
          max: 100
stop_selling:
  name: Stop active selling
  description: Restore the previous Work Mode and TOU SOC, then mark the active selling period complete.
restart_selling:
  name: Restart completed selling period
  description: Restart a completed period only while its original one-hour window is still active.
  fields:
    date:
      name: Plan date (YYYY-MM-DD)
      required: true
      selector:
        text:
    start:
      name: Start time (HH:MM)
      required: true
      selector:
        text:
